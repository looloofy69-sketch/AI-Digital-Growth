[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-digital-growth-core"
version = "0.1.0"
description = "Testable domain core for AI Digital Growth's first commercial workflow"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary - license decision pending" }
authors = [{ name = "AI Digital Growth" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
adg-economics = "ai_digital_growth.cli:main"
adg-audit = "ai_digital_growth.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
